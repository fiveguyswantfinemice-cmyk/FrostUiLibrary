<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My UI Library Generator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-indigo-400">UI Script Generator</h1>
            <p class="text-sm text-slate-400 mt-1">Customize your window and copy your script instantly!</p>
        </div>

        <!-- Customizer Form Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-4 shadow-xl">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Window Title</label>
                <input type="text" id="windowTitle" value="My Custom Hub" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500"
                    oninput="updateScript()">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Accent Color</label>
                <input type="color" id="accentColor" value="#6366f1" 
                    class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer p-1"
                    oninput="updateScript()">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Button Text</label>
                <input type="text" id="buttonText" value="Print Hello" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500"
                    oninput="updateScript()">
            </div>
        </div>

        <!-- Generated Script Output Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-3 shadow-xl">
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-slate-300">Generated Roblox Script</span>
                <button onclick="copyScript()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                    Copy Script
                </button>
            </div>
            <pre class="bg-slate-900 p-4 rounded-xl text-xs text-indigo-300 overflow-x-auto border border-slate-700/50"><code id="scriptOutput"></code></pre>
        </div>
    </div>

    <script>
        function updateScript() {
            const title = document.getElementById('windowTitle').value;
            const color = document.getElementById('accentColor').value;
            const btnText = document.getElementById('buttonText').value;

            // This outputs the Lua script template using the user's choices
            const scriptText = `-- Generated by My Custom UI Library Builder
local Library = loadstring(game:HttpGet("YOUR_RAW_GITHUB_LINK_TO_LIBRARY"))()

local Window = Library:CreateWindow({
    Name = "${title}",
    AccentColor = Color3.fromHex("${color}")
})

Window:AddButton("${btnText}", function()
    print("Button clicked from customized UI!")
end)`;

            document.getElementById('scriptOutput').innerText = scriptText;
        }

        function copyScript() {
            const text = document.getElementById('scriptOutput').innerText;
            navigator.clipboard.writeText(text);
            alert("Script copied to clipboard!");
        }

        // Run on load
        updateScript();
    </script>
</body>
</html>
